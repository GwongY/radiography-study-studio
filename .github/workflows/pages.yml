# Publishes outputs/ to GitHub Pages after verification.
# The owner requested a return to GitHub Pages on 2026-10-03.
name: Deploy study studio to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ESLint for work/undef-check.mjs (no-undef only). Check tooling, not the app.
      - name: Install the check-only lint tooling
        run: npm ci --prefix work/lint --no-audit --no-fund
      # One runner, one list: work/check.mjs names every check that needs no
      # browser and no source drive. A failure is printed as a named group and
      # an error annotation, so the red X still says which check failed.
      - name: Every check (work/check.mjs)
        run: node work/check.mjs

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - id: deployment
        uses: actions/deploy-pages@v4
